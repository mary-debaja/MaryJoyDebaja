
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student API Interface</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f5f7fb;
            color: #333;
        }

        h1, h2 {
            color: #2563eb;
        }

        button {
            padding: 8px 14px;
            margin: 5px;
            cursor: pointer;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #result, #studentList {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            background-color: white;
        }

        #greeting, #ageResult {
            margin-top: 15px;
            font-weight: bold;
        }

        hr {
            margin: 30px 0;
            border: none;
            border-top: 1px solid #ddd;
        }
    </style>
</head>

<body>
    <h1>Student API Interface</h1>

    <button onclick="loadStudent()">
        Load Student Information
    </button>

    <div id="result"></div>

    <hr>

    <h2>Greeting API</h2>

    <input type="text" id="nameInput"
           placeholder="Enter your first name">

    <button onclick="sayHello()">Say Hello</button>

    <p id="greeting"></p>

    <hr>

    <h2>Age Calculator API</h2>

    <input type="number" id="birthYear"
           placeholder="Enter your birth year">

    <button onclick="calculateAge()">
        Calculate Age
    </button>

    <div id="ageResult"></div>

    <hr>

    <h2>Students from Database</h2>

    <button onclick="loadStudents()">
        Load Students
    </button>

    <div id="studentList"></div>

    <script>
        // Student Information
        function loadStudent() {
            fetch('/student')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('result').innerHTML =
                        '<p><b>Student ID:</b> ' + data.student_id + '</p>' +
                        '<p><b>Name:</b> ' + data.name + '</p>' +
                        '<p><b>Program:</b> ' + data.program + '</p>' +
                        '<p><b>Year:</b> ' + data.year + '</p>' +
                        '<p><b>Section:</b> ' + data.section + '</p>';
                })
                .catch(error => {
                    document.getElementById('result').innerHTML =
                        '<p>Unable to retrieve data.</p>';
                });
        }

        // Greeting API
        function sayHello() {
            const name = document.getElementById('nameInput').value;

            fetch('/hello?name=' + encodeURIComponent(name))
                .then(response => response.json())
                .then(data => {
                    document.getElementById('greeting').innerText =
                        data.message;
                })
                .catch(error => {
                    document.getElementById('greeting').innerText =
                        'Unable to retrieve greeting.';
                });
        }

        // Age Calculator API
        function calculateAge() {
            const year = document.getElementById('birthYear').value;

            if (year === '') {
                document.getElementById('ageResult').innerText =
                    'Please enter your birth year.';
                return;
            }

            fetch('/age?year=' + encodeURIComponent(year))
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        document.getElementById('ageResult').innerText =
                            data.error;
                    } else {
                        document.getElementById('ageResult').innerHTML =
                            '<p><b>Birth Year:</b> ' + data.birth_year + '</p>' +
                            '<p><b>Calculated Age:</b> ' + data.calculated_age + '</p>';
                    }
                })
                .catch(error => {
                    document.getElementById('ageResult').innerText =
                        'Unable to calculate age.';
                });
        }

        // Step 8: Load Students from Database
        function loadStudents() {
            fetch('/students')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Request failed');
                    }
                    return response.json();
                })
                .then(data => {
                    let output = '';

                    data.forEach(student => {
                        output +=
                            '<p>' +
                            '<b>' + student.student_id + '</b> - ' +
                            student.name + ' | ' +
                            student.program + ' | Year ' +
                            student.year + ' | Section ' +
                            student.section +
                            '</p>';
                    });

                    document.getElementById('studentList').innerHTML =
                        output || '<p>No student records found.</p>';
                })
                .catch(error => {
                    document.getElementById('studentList').innerHTML =
                        '<p>Unable to retrieve student records.</p>';
                });
        }
    </script>
</body>
</html>
